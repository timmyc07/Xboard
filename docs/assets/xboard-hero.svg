<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Xboard — Keep your flow.</title>
  <desc id="description">A product illustration of Xboard clipboard history with a search field, three fictional items, and an Option V shortcut. This is an illustrative layout, not a screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101428"/>
      <stop offset=".54" stop-color="#111B30"/>
      <stop offset="1" stop-color="#102E38"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="110" x2="450" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AC9BFF"/>
      <stop offset="1" stop-color="#69E1DA"/>
    </linearGradient>
    <linearGradient id="panel" x1="735" y1="125" x2="1160" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263248"/>
      <stop offset="1" stop-color="#182434"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7662F2" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7662F2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="570" y="60" width="710" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020712" flood-opacity=".55"/>
    </filter>
    <clipPath id="canvas"><rect width="1280" height="720" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1280" height="720" fill="url(#background)"/>
    <circle cx="900" cy="330" r="420" fill="url(#glow)"/>
    <path d="M652 0V720M0 584H1280" stroke="#C8D9FF" stroke-opacity=".055"/>
    <path d="M1120 0L400 720M1280 140L700 720" stroke="#C8D9FF" stroke-opacity=".035"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <g transform="translate(72 70)">
        <rect width="40" height="40" rx="12" fill="#8872F3"/>
        <rect x="12" y="12" width="17" height="20" rx="3" stroke="white" stroke-width="2"/>
        <rect x="16" y="8" width="9" height="6" rx="2" fill="#8872F3" stroke="white" stroke-width="2"/>
        <path d="M17 21H24M17 26H22" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <text x="54" y="29" fill="#F3F6FF" font-size="26" font-weight="650" letter-spacing="-.8">Xboard</text>
      </g>
      <text x="72" y="200" fill="#AEBFD7" font-size="13" font-weight="650" letter-spacing="3">YOUR CLIPBOARD. WITH A MEMORY.</text>
      <text x="66" y="288" fill="#F5F7FF" font-size="84" font-weight="750" letter-spacing="-5">Keep your</text>
      <text x="66" y="380" fill="url(#accent)" font-size="84" font-weight="750" letter-spacing="-5">flow.</text>
      <text x="73" y="435" fill="#B7C6DD" font-size="22" letter-spacing="-.4">Copy it. Find it. Use it again.</text>
      <g transform="translate(72 477)">
        <rect width="194" height="60" rx="15" fill="#F1F4FF"/>
        <text x="22" y="39" fill="#192338" font-size="28" font-weight="650">⌥ V</text>
        <path d="M93 16V44" stroke="#B9C1D1"/>
        <text x="110" y="36" fill="#33425D" font-size="16" font-weight="600">Find a clip</text>
      </g>
      <text x="73" y="618" fill="#ECF2FF" font-size="14" font-weight="600">Native macOS</text>
      <circle cx="204" cy="613" r="2" fill="#6D7E9B"/>
      <text x="223" y="618" fill="#ECF2FF" font-size="14" font-weight="600">Local &amp; encrypted</text>
      <circle cx="373" cy="613" r="2" fill="#6D7E9B"/>
      <text x="392" y="618" fill="#ECF2FF" font-size="14" font-weight="600">Free to use</text>
      <g filter="url(#shadow)">
        <rect x="676" y="126" width="522" height="463" rx="26" fill="url(#panel)" stroke="#9FB2D4" stroke-opacity=".28"/>
      </g>
      <g transform="translate(702 155)">
        <rect x="0" y="1" width="17" height="22" rx="3" stroke="#83E1E7" stroke-width="1.8"/>
        <rect x="5" y="-2" width="8" height="6" rx="2" fill="#263248" stroke="#83E1E7" stroke-width="1.8"/>
        <text x="30" y="20" fill="#F2F5FF" font-size="21" font-weight="650" letter-spacing="-.5">Xboard</text>
        <text x="434" y="19" fill="#A5B3CC" font-size="15">3</text>
        <path d="M463 7L473 17M473 7L463 17" stroke="#A5B3CC" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <rect x="701" y="204" width="471" height="46" rx="13" fill="#0D1727" fill-opacity=".55" stroke="#8092B5" stroke-opacity=".18"/>
      <circle cx="722" cy="226" r="6" stroke="#99A9C3" stroke-width="1.7"/>
      <path d="M726.5 230.5L731 235" stroke="#99A9C3" stroke-width="1.7" stroke-linecap="round"/>
      <text x="744" y="233" fill="#9EACC5" font-size="15">Search your history</text>
      <rect x="702" y="269" width="470" height="84" rx="15" fill="#7A6AEC" fill-opacity=".18" stroke="#9B8CFF" stroke-opacity=".8"/>
      <g transform="translate(718 288)">
        <rect width="42" height="42" rx="11" fill="#8872F3" fill-opacity=".22"/>
        <path d="M13 13H29M21 13V30M17 30H25" stroke="#C9C0FF" stroke-width="1.8" stroke-linecap="round"/>
        <text x="57" y="15" fill="#E2DCF9" font-size="11" font-weight="600" letter-spacing="1">TEXT</text>
        <text x="57" y="40" fill="#F4F3FF" font-size="20" font-weight="550" letter-spacing="-.4">The next big idea.</text>
        <text x="405" y="37" fill="#BDB0FF" font-size="13">⌘1</text>
      </g>
      <g transform="translate(718 381)">
        <rect width="42" height="42" rx="11" fill="#4DDAC9" fill-opacity=".12"/>
        <path d="M19 25L25 19M17 27L14 30C9 34 5 28 9 24L13 20M27 17L30 14C34 9 28 5 24 9L20 13" transform="translate(1 1) scale(.85)" stroke="#8CE4DA" stroke-width="2" stroke-linecap="round"/>
        <text x="57" y="14" fill="#93C5C9" font-size="11" font-weight="600" letter-spacing="1">LINK</text>
        <text x="57" y="40" fill="#E1EAF6" font-size="18" letter-spacing="-.2">example.com/launch</text>
        <text x="405" y="37" fill="#899AB6" font-size="13">⌘2</text>
      </g>
      <path d="M719 446H1156" stroke="#A8BADC" stroke-opacity=".1"/>
      <g transform="translate(718 469)">
        <rect width="42" height="42" rx="11" fill="#6FA9EF" fill-opacity=".16"/>
        <rect x="11" y="11" width="21" height="20" rx="3" stroke="#A3C9FA" stroke-width="1.6"/>
        <path d="M12 27L19 20L25 25L29 21L32 25" stroke="#A3C9FA" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="26" cy="16" r="2" fill="#A3C9FA"/>
        <text x="57" y="14" fill="#97B6DA" font-size="11" font-weight="600" letter-spacing="1">IMAGE</text>
        <text x="57" y="40" fill="#E1EAF6" font-size="18" letter-spacing="-.2">A little inspiration.</text>
        <text x="405" y="37" fill="#899AB6" font-size="13">⌘3</text>
      </g>
      <path d="M702 534H1172" stroke="#A8BADC" stroke-opacity=".13"/>
      <text x="705" y="562" fill="#9DACCA" font-size="12">↑↓ Select</text>
      <text x="803" y="562" fill="#9DACCA" font-size="12">↵ Paste</text>
      <text x="889" y="562" fill="#9DACCA" font-size="12">esc Close</text>
      <text x="1197" y="621" text-anchor="end" fill="#8295AF" font-size="10" font-weight="500" letter-spacing="1.4">PRODUCT ILLUSTRATION · SAMPLE CONTENT</text>
    </g>
    <rect x=".5" y=".5" width="1279" height="719" rx="27.5" stroke="#B3C2DE" stroke-opacity=".12"/>
  </g>
</svg>
